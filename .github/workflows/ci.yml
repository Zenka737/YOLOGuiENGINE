name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 src --max-line-length=120 --ignore=E501,W503

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - run: python -m pytest tests/ -v

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyQt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libgl1 xvfb
          pip install PyQt6 PyQt6-Qt6 PyQt6-sip
      - name: Check syntax
        run: |
          python -m py_compile src/main.py
          python -m py_compile src/core/detector.py
          python -m py_compile src/ui/main_window.py
          python -m py_compile src/ui/tab_detection.py
          python -m py_compile src/ui/tab_training.py
          python -m py_compile src/ui/tab_annotation.py
          python -m py_compile src/ui/tab_models.py
          echo "All syntax checks passed"
